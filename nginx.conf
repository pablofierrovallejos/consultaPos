map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  add_header Access-Control-Allow-Origin *;
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable      "MSIE [1-6]\.";
  gzip_min_length   256;
  gzip_vary         on;
  gzip_proxied      expired no-cache no-store private auth;
  gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level   9;

  root /usr/share/nginx/html;

  # Proxy para ventas (redirige a servicio-productos)
  # Reescribimos /api/ventas/* → /api/* para que el servicio de productos
  # reciba las rutas esperadas: /api/productos/insertar-venta
  location /api/ventas/ {
    rewrite ^/api/ventas/(.*)$ /api/$1 break;
    proxy_pass http://servicio-productos:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy para emisión de boleta (microservicio SII)
  location /api/emitir-boleta {
    proxy_pass http://ms-sii-boleta:5000/api/emitir-boleta;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy para consultas de boletas (microservicio SII)
  # Rutas: /api/boletas/*, /api/boleta/*
  location ~ ^/api/boleta {
    proxy_pass http://ms-sii-boleta:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy para el microservicio de energía (contenedor Docker en red compartida)
  # El microservicio tiene las rutas en la raíz (sin /api/energia/)
  # Ejemplo: /consultar-measures/Meas1/2025-10-01
  location /api/energia/ {
    rewrite ^/api/energia/(.*)$ /$1 break;
    proxy_pass http://ms-concentrador-energia:8002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy para el backend API de productos (contenedor Docker en red compartida)
  location /api/ {
    proxy_pass http://servicio-productos:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy para WebSocket de notificaciones
  location /ws/notificaciones {
    proxy_pass http://ms-notifica:8080/ws/notificaciones;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400; # 24 horas para mantener la conexión WebSocket
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }


}
